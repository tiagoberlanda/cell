name: cell
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cell
      POSTGRES_DB: cell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cell -d cell"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: cell-server:${CELL_VERSION:-dev}
    build: {context: ., target: server, args: {CELL_VERSION: "${CELL_VERSION:-dev}"}}
    restart: unless-stopped
    environment: &server-env
      DATABASE_URL: postgres://cell:${POSTGRES_PASSWORD}@db:5432/cell
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-http://host.docker.internal:20128/v1}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      NINEROUTER_DEFAULT_MODEL: ${NINEROUTER_DEFAULT_MODEL:-}
      # Comma-separated list: every address the browser may use (e.g. https://192.168.0.10,https://localhost).
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost}
      COOKIE_SECURE: "true"
      # Optional: secret header added by a Cloudflare transform rule, so only the tunnel can set the client IP.
      CELL_PROXY_SECRET: ${CELL_PROXY_SECRET:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      WORKSPACE_PATH: /data
      # Cell Host (scripts/host.ps1): commands on this computer, each approved by the owner.
      CELL_HOST_URL: ${CELL_HOST_URL:-}
      CELL_HOST_TOKEN: ${CELL_HOST_TOKEN:-}
      PORT: "3001"
    volumes: ["workspace:/data"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    image: cell-server:${CELL_VERSION:-dev}
    build: {context: ., target: server, args: {CELL_VERSION: "${CELL_VERSION:-dev}"}}
    restart: unless-stopped
    command: ["node", "--import", "tsx", "apps/server/src/worker.ts"]
    environment: *server-env
    volumes: ["workspace:/data"]
    depends_on:
      api: {condition: service_healthy}
  web:
    image: cell-web:${CELL_VERSION:-dev}
    build: {context: ., target: web, args: {CELL_VERSION: "${CELL_VERSION:-dev}"}}
    restart: unless-stopped
    environment:
      CELL_HOST: ${CELL_HOST:-localhost}
      CELL_DEFAULT_SNI: ${CELL_DEFAULT_SNI:-localhost}
    ports: ["443:443", "80:80"]
    volumes: ["caddy_data:/data", "caddy_config:/config"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres:
  workspace:
  caddy_data:
  caddy_config:
